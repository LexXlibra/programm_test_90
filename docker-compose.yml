services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nynety
      POSTGRES_USER: nynety
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nynety_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nynety -d nynety"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "npx prisma migrate deploy && NODE_ENV=development npx tsx prisma/seed.mjs && node .next/standalone/server.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nynety:${POSTGRES_PASSWORD:-nynety_local_only}@postgres:5432/nynety?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Copy .env.example to .env and set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      STORAGE_PATH: /app/storage/releases
      MAX_AUDIO_FILE_SIZE_MB: ${MAX_AUDIO_FILE_SIZE_MB:-250}
      MAX_ARTWORK_FILE_SIZE_MB: ${MAX_ARTWORK_FILE_SIZE_MB:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - release_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  release_storage:
  caddy_data:
  caddy_config:
  caddy_logs:
